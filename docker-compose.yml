services:
  backend:
    build:
      context: ./backend/acs
      dockerfile: Dockerfile
    container_name: acs-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      ACS_DB_PATH: /data/db/acs.sqlite
      ACS_STORAGE_ROOT: /data/cloud
      ACS_JWT_SECRET: dev-secret
    volumes:
      - backend_db:/data/db
      - backend_cloud:/data/cloud
    restart: unless-stopped

volumes:
  backend_db:
  backend_cloud:
