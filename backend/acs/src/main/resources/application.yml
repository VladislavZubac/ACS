spring:
  application:
    name: acs
  datasource:
    url: jdbc:sqlite:${ACS_DB_PATH:./data/db/acs.sqlite}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${ACS_MAX_FILE_SIZE:100MB}
      max-request-size: ${ACS_MAX_REQUEST_SIZE:110MB}
  docker:
    compose:
      enabled: false

storage:
  root-path: ${ACS_STORAGE_ROOT:backend/cloud}

jwt:
  secret: ${ACS_JWT_SECRET:this_is_a_long_default_jwt_secret_that_should_be_replaced}
  expiration-seconds: ${ACS_JWT_EXPIRATION_SECONDS:3600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  user-defaults:
    assigned-space-bytes: ${ACS_USER_DEFAULT_ASSIGNED_SPACE_BYTES:5368709120} # 5 GB
  admin:
    username: ${ACS_ADMIN_USERNAME:admin}
    password: ${ACS_ADMIN_PASSWORD:admin12345}
    assigned-space-bytes: ${ACS_ADMIN_ASSIGNED_SPACE_BYTES:107374182400} # 100 GB
  cors:
    allowed-origins:
      - ${ACS_CORS_ALLOWED_ORIGIN_FRONTEND:http://localhost:3000}
      - ${ACS_CORS_ALLOWED_ORIGIN_ADMIN:http://localhost:3001}
  share:
    cleanup-fixed-delay: ${ACS_SHARE_CLEANUP_DELAY:PT1H}

logging:
  file:
    name: ${ACS_LOG_FILE:logs/acs.log}
  level:
    root: INFO
    com.example.acs: DEBUG
    org.springframework.security: INFO

